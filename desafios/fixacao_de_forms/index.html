<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Preencha o Formulário!</h1>
    <form action="cadastro.php" method="get">
        <p>
            <label for="inome">Nome: </label>
            <input type="text" name="nome" id="inome" minlength="10" maxlength="50" placeholder="Nome Completo" required>
        </p>
        <p>
            <label for="iidade">Idade</label>
            <input type="number" name="idade" id="iidade" min="0" max="100" required>
        </p>
        <p>
            <input type="radio" name="gen" id="igen" value="Masculino" required> Masculino <br>
            <input type="radio" name="gen" id="igen" value="Feminino" required> Feminino
        </p>
        <p>
            <label for="icor">Cor Favorita: </label>
            <input type="color" name="cor" id="icor" required>
        </p>
        <p>
            <label for="imsg">Mensagem pessoal: </label> <br>
            <textarea name="msg" id="imsg" minlength="10" maxlength="1000" required placeholder="Digite sua mensagem..." ></textarea>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
